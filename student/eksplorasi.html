<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eksplorasi Kamera | Pintar Finansial</title>
    <link rel="stylesheet" href="../shared/css/global.css">
    <link rel="stylesheet" href="css/student-style.css">
    <style>
        .tabs { display: flex; justify-content: center; gap: 20px; margin-bottom: 30px; }
        .tab-btn { background-color: var(--secondary-color); color: white; border-radius: 20px; padding: 10px 20px; font-size: 1.1rem; text-decoration: none; display: inline-block; }
        .tab-btn.active { background-color: var(--primary-color); transform: scale(1.05); }
        .form-group { margin-bottom: 20px; text-align: left; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; }
        .form-control { width: 100%; padding: 12px; border: 2px solid #E0E0E0; border-radius: 10px; font-family: inherit; font-size: 1rem; }
        .quiz-card { background: #fff; padding: 30px; border-radius: 20px; box-shadow: var(--shadow-md); max-width: 600px; margin: 0 auto; text-align: center; }
    </style>
</head>
<body>
    <nav class="student-nav">
        <div class="container nav-container">
            <div class="logo">Pintar Finansial 👦👧</div>
            <a href="index.html" class="btn btn-home">Kembali</a>
        </div>
    </nav>
    <main class="container" style="margin-top: 40px; margin-bottom: 50px;">
        <div class="tabs">
            <button class="btn tab-btn active">📸 Ayo Foto Barang!</button>
            <a href="kuis-belanja.html" class="btn tab-btn">🛒 Main Kuis Belanja</a>
        </div>
        <section class="quiz-card">
            <h2>Tambah Barang Sekitarmu</h2>
            <p id="limitInfo" style="margin-bottom: 20px; color: var(--danger); font-weight: bold;"></p>
            <form id="formEksplorasi">
                <div class="form-group">
                    <label>Ambil Foto Barang:</label>
                    <input type="file" id="fotoBarang" accept="image/*" capture="camera" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Nama Barang:</label>
                    <input type="text" id="namaBarang" class="form-control" placeholder="Contoh: Buku Tulis" required>
                </div>
                <div class="form-group">
                    <label>Harga Barang (Kira-kira):</label>
                    <input type="number" id="hargaBarang" class="form-control" placeholder="Contoh: 5000" min="500" required>
                </div>
                <div class="form-group">
                    <label>Jenis Barang:</label>
                    <select id="kategoriBarang" class="form-control" required>
                        <option value="">-- Pilih Jenis --</option>
                        <option value="kebutuhan">Kebutuhan</option>
                        <option value="keinginan">Keinginan</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-student" style="width: 100%;">Simpan Barang!</button>
            </form>
        </section>

        <!-- Seksi Baru: Menampilkan foto barang milik siswa sendiri -->
        <section class="quiz-card" style="margin-top: 30px; margin-bottom: 50px;">
            <h2>Barang yang Kamu Foto</h2>
            <div id="myItemsList" style="display: flex; flex-wrap: wrap; gap: 15px; justify-content: center; margin-top: 20px;">
                <!-- Akan diisi oleh JavaScript -->
            </div>
        </section>
    <!-- Memuat Firebase SDK (Compat Version untuk mendukung file://) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    
    <script src="../shared/js/firebase-db.js" defer></script>
    <script src="../shared/js/utils.js" defer></script>
    <script src="js/eksplorasi.js" defer></script>
</body>
</html>
